name: Desktop app

on:
  push:
    branches: ["**"]
    # Path filters are not evaluated for tag pushes, so every v* tag builds and publishes a release.
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 22.04's glibc 2.35 keeps the Linux binary runnable on Debian 12 and other older distros.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release --workspace

      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n1)" >> "$GITHUB_ENV"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          install -m 0755 target/release/lyrics-island dist/lyrics-island

          stage_tar=$(mktemp -d)
          chmod 0755 "$stage_tar"
          mkdir -m 0755 -p "$stage_tar/packaging"
          install -m 0755 target/release/lyrics-island "$stage_tar/lyrics-island"
          install -m 0755 install.sh "$stage_tar/install.sh"
          install -m 0644 packaging/lyrics-island.desktop "$stage_tar/packaging/lyrics-island.desktop"
          install -m 0644 packaging/lyrics-island.svg "$stage_tar/packaging/lyrics-island.svg"
          tar -C "$stage_tar" --owner=0 --group=0 -czf dist/lyrics-island-linux-x86_64.tar.gz \
            lyrics-island install.sh packaging/lyrics-island.desktop packaging/lyrics-island.svg
          rm -rf "$stage_tar"

          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" nfpm
          for p in deb rpm archlinux; do
            "$RUNNER_TEMP/nfpm" package --config packaging/nfpm.yaml --packager "$p" --target dist/
          done

          appdir="$RUNNER_TEMP/AppDir"
          mkdir -p "$appdir/usr/bin"
          install -m 0755 target/release/lyrics-island "$appdir/usr/bin/lyrics-island"
          install -m 0644 packaging/lyrics-island.desktop packaging/lyrics-island.svg "$appdir/"
          ln -s usr/bin/lyrics-island "$appdir/AppRun"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$appdir" \
            "dist/Lyrics_Island-$VERSION-x86_64.AppImage"

      - name: Package Windows
        if: runner.os == 'Windows'
        run: mkdir dist && cp target/release/lyrics-island.exe "dist/lyrics-island-$VERSION-windows-x86_64.exe"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          app="dist/Lyrics Island.app/Contents"
          mkdir -p "$app/MacOS" "$app/Frameworks"
          cp target/release/lyrics-island "$app/MacOS/"
          cp target/release/libmr_helper.dylib "$app/Frameworks/"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Lyrics Island</string>
            <key>CFBundleIdentifier</key><string>dev.blog.lyrics-island</string>
            <key>CFBundleExecutable</key><string>lyrics-island</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSAppleEventsUsageDescription</key><string>Reads the current track from Spotify and Music.</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/Lyrics Island.app"
          stage=$(mktemp -d)
          mv "dist/Lyrics Island.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Lyrics Island" -srcfolder "$stage" -ov -format UDZO \
            "dist/Lyrics-Island-$VERSION-macos-$(uname -m).dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-island-${{ runner.os }}
          path: desktop/dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
