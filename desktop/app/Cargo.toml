[package]
name = "lyrics-island"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Dynamic Island-style synced lyrics overlay for Windows, macOS and Linux"

[dependencies]
winit = "0.30.13"
raw-window-handle = "0.6"
tiny-skia = "0.12"
cosmic-text = "0.19"
global-hotkey = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# zbus 6 dropped the blocking API; 5 is also what tray-icon's ksni already pulls in.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = "0.14"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
memmap2 = "0.9"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
